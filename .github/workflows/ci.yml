
name: ML API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python -m model_training.train

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t iris-ml-api:ci .

  terraform-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra validate
